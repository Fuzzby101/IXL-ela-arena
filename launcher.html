<button id="hub">Open</button>

<script>
const BASE = "https://cdn.jsdelivr.net/gh/Fuzzby101/IXL-ela-arena@main/";

document.getElementById("hub").onclick = async () => {
  const win = window.open("about:blank", "_blank");
  if (!win) return alert("Please allow popups.");
  let html = await fetch(BASE + "index.html?v=" + Date.now()).then(r => r.text());
  html = html.replace("<head>", `<head><base href="${BASE}">`);
  win.document.open();
  win.document.write(html);
  win.document.close();
};
</script>
